name: CI

# Mesmas checagens do npm run ci, menos o Lighthouse (nota 100 exata oscila em runner compartilhado): ele roda
# na máquina, com npm run ci ou npm run check:lighthouse, antes do deploy. Sem deploy aqui: o deploy é manual.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium do Playwright: usado pelo axe.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm run check:csp
      - run: npm run check:seo
      - run: npm run check:links
      - run: npm run check:jsonld
      - run: npm run check:axe
